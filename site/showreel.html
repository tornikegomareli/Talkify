<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talkify — Showreel</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
  :root {
    --ink: #f5f5f7;
    --ink-dim: rgba(245, 245, 247, 0.6);
    --amber: #ffb457;
    --ember: #ff7847;
    --gap: 26px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05050a;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* The recording surface: a fixed 16:9 stage so every capture is framed
     identically. It scales to the viewport but never changes proportion. */
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background-color: #05050a;
    background-image: url("assets/hero.png");
    background-size: cover;
    background-position: center 35%;
  }

  body.plain .stage { background-image: none; }

  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(4, 4, 10, 0.5), rgba(4, 4, 10, 0.1) 30%, rgba(4, 4, 10, 0.6));
  }

  body.plain .stage::after { background: none; }

  .grid {
    position: relative;
    z-index: 2;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: var(--gap);
    padding: calc(var(--gap) * 1.2);
    align-items: center;
  }

  body.rows .grid { grid-template-columns: 1fr; grid-template-rows: repeat(6, 1fr); }
  body.wide .grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; }

  .cell { position: relative; display: flex; flex-direction: column; justify-content: center; }

  /* Each clip carries its own alpha: the island body and the light are the
     same pixels, so they drop straight onto the background. */
  .cell video {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 2px;
  }

  .label {
    position: absolute;
    left: 2px;
    bottom: -4px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: clamp(9px, 0.85vw, 13px);
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
    transition: opacity 0.2s;
  }

  body.nolabels .label { opacity: 0; }

  .label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, #9a9aa6); flex: none; }

  /* Wordmark, so a social clip is attributable on its own */
  .mark {
    position: absolute;
    z-index: 3;
    left: 50%;
    bottom: 2.2%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: clamp(11px, 1.1vw, 16px);
    font-weight: 700;
    letter-spacing: 0.02em;
    color: rgba(245, 245, 247, 0.9);
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
    transition: opacity 0.2s;
  }

  .mark img { width: 1.5em; height: 1.5em; display: block; }
  body.nolabels .mark { opacity: 0; }

  /* Controls sit outside the stage so they never appear in a capture of it,
     and hide entirely with H. */
  .controls {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 20;
    display: flex;
    gap: 6px;
    padding: 8px;
    border-radius: 999px;
    background: rgba(10, 10, 14, 0.82);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(245, 245, 247, 0.14);
    transition: opacity 0.25s;
  }

  .controls.hidden { opacity: 0; pointer-events: none; }

  .controls button {
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid rgba(245, 245, 247, 0.16);
    background: transparent;
    color: rgba(245, 245, 247, 0.8);
    font: 600 12px/1 inherit;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }

  .controls button:hover { color: var(--ink); border-color: rgba(255, 180, 87, 0.6); background: rgba(255, 150, 80, 0.12); }
  .controls kbd {
    font: inherit;
    font-size: 10px;
    opacity: 0.55;
    margin-left: 5px;
  }

  .hint {
    position: fixed;
    left: 14px;
    bottom: 18px;
    z-index: 20;
    font-size: 11.5px;
    color: rgba(245, 245, 247, 0.35);
    transition: opacity 0.25s;
  }

  .hint.hidden { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .cell video { /* still autoplay: this page exists to show the motion */ }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="grid" id="grid"></div>
  <div class="mark">
    <img src="assets/favicon.svg" alt="">
    Talkify
  </div>
</div>

<div class="controls" id="controls">
  <button data-act="restart">Restart in sync<kbd>R</kbd></button>
  <button data-act="layout">Layout<kbd>L</kbd></button>
  <button data-act="bg">Background<kbd>B</kbd></button>
  <button data-act="labels">Labels<kbd>T</kbd></button>
  <button data-act="hide">Hide UI<kbd>H</kbd></button>
</div>
<p class="hint" id="hint">Press H to hide this UI before recording · R restarts every clip together</p>

<script>
  var CLIPS = [
    { key: "sunset",   name: "Edge Glow · Sunset",   color: "linear-gradient(135deg,#ff4d67,#ffb457)" },
    { key: "aurora",   name: "Edge Glow · Aurora",   color: "linear-gradient(135deg,#3ddc84,#2bd4c4)" },
    { key: "spectrum", name: "Edge Glow · Spectrum", color: "conic-gradient(#ff5f5f,#ffd05f,#5fff8f,#5fb0ff,#b45fff,#ff5f5f)" },
    { key: "ocean",    name: "Edge Glow · Ocean",    color: "linear-gradient(135deg,#2e7cf6,#39c2ff)" },
    { key: "compact",  name: "Compact captions",     color: "#f5f5f7" },
    { key: "siriwave", name: "Waveform · Siri",      color: "linear-gradient(90deg,#4be38b,#57a7ff,#e35757)" },
  ];

  var grid = document.getElementById("grid");
  var ext = document.createElement("video").canPlayType('video/webm; codecs="vp9"') !== "" ? ".webm" : ".mov";
  var videos = [];

  CLIPS.forEach(function (c) {
    var cell = document.createElement("div");
    cell.className = "cell";

    var v = document.createElement("video");
    v.src = "assets/hud-" + c.key + ext;
    v.muted = true;
    v.loop = true;
    v.autoplay = true;
    v.playsInline = true;
    v.preload = "auto";
    cell.appendChild(v);
    videos.push(v);

    var label = document.createElement("span");
    label.className = "label";
    label.innerHTML = '<span class="dot" style="--c:' + c.color + '"></span>' + c.name;
    cell.appendChild(label);

    grid.appendChild(cell);
  });

  // Start every clip on the same frame: buffer them all first, then play in
  // one go, so the grid comes alive as a single shot rather than a stagger.
  // Each wait calls load() itself — waiting on an element that never started
  // loading deadlocks — and resolves on error or timeout so one bad clip can
  // never hold the others back.
  function buffered(v) {
    if (v.readyState >= 2) return Promise.resolve();
    return new Promise(function (resolve) {
      var done = function () { clearTimeout(timer); resolve(); };
      v.addEventListener("canplay", done, { once: true });
      v.addEventListener("error", done, { once: true });
      var timer = setTimeout(done, 4000);
      v.load();
    });
  }

  function restart() {
    videos.forEach(function (v) { v.pause(); });
    Promise.all(videos.map(buffered)).then(function () {
      videos.forEach(function (v) {
        try { v.currentTime = 0; } catch (e) {}
      });
      requestAnimationFrame(function () {
        videos.forEach(function (v) { v.play().catch(function () {}); });
      });
    });
  }

  var LAYOUTS = ["", "wide", "rows"];
  var layout = 0;

  var actions = {
    restart: restart,
    layout: function () {
      document.body.classList.remove.apply(document.body.classList, LAYOUTS.filter(Boolean));
      layout = (layout + 1) % LAYOUTS.length;
      if (LAYOUTS[layout]) document.body.classList.add(LAYOUTS[layout]);
    },
    bg: function () { document.body.classList.toggle("plain"); },
    labels: function () { document.body.classList.toggle("nolabels"); },
    hide: function () {
      document.getElementById("controls").classList.add("hidden");
      document.getElementById("hint").classList.add("hidden");
    },
  };

  document.getElementById("controls").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-act]");
    if (btn) actions[btn.dataset.act]();
  });

  document.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "r") actions.restart();
    if (k === "l") actions.layout();
    if (k === "b") actions.bg();
    if (k === "t") actions.labels();
    if (k === "h") {
      var c = document.getElementById("controls");
      c.classList.toggle("hidden");
      document.getElementById("hint").classList.toggle("hidden");
    }
    if (k === "f") {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
  });

  restart();
</script>

</body>
</html>
